# Varanasi demand calendar for the daily SEO pipeline (.claude/skills/seo-article).
#
# Festival dates follow the Hindu lunar calendar and move every year. Rules:
#   - status: confirmed   only when 2+ independent sources (ideally a panchang such as drikpanchang.com) agree
#   - status: unverified  anything else; the job must verify before writing date-specific copy
#   - Add next year's dates as soon as they are published.
#
# publish_lead_days: how long before the event the article should be live.
# Search interest builds 3-6 weeks ahead, and a new page needs time to get indexed.
#
# demand: expected tourist surge (high | medium | low)
# rental_angle: why a two-wheeler is genuinely useful for this event. Be honest:
#   if vehicles are banned near the venue, say so and sell the part that works.

events:
  - id: dev-deepawali
    name: Dev Deepawali (Kartik Purnima)
    dates:
      2026: { start: "2026-11-24", status: confirmed, source: "hindutone.com, festival calendars; Kartik Purnima" }
    publish_lead_days: 35
    demand: high
    rental_angle: >
      Ghat-side roads become no-vehicle zones from late morning and autos are restricted, so cabs surge.
      A scooty gets you to the outer parking points (Maidagin, Beniabagh, Sigra, Luxa) early,
      then you walk in. Also useful for the days around it, since hotels near the ghats sell out.
    keywords:
      - dev deepawali varanasi 2026
      - dev diwali varanasi date
      - how to reach ghats on dev deepawali
      - dev deepawali parking varanasi
      - dev diwali boat booking
    related_posts: [best-way-to-travel-in-varanasi, 2-day-varanasi-itinerary]

